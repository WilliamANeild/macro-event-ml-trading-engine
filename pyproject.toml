[project]
name = "macro-event-ml-trading-engine"
version = "0.1.0"
description = "Event-driven multi-sleeve trading engine skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "yfinance>=0.2.36",
    "fredapi>=0.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]